<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
</head>
<body>
    <h3>User Sign Up</h3>
    <form action="" method="POST">
        <label>First Name: </label>
        <input type="text" name="fname" maxlength="32" placeholder="First name"autofocus required> <br><br>
         
        <label>Last Name: </label>
        <input type="text" name="lname" maxlength="16" placeholder="Last name"required> <br><br>

        <label>Username: </label>
        <input type="text" name="uname" placeholder="User name"> <br><br>

        <label>Password: </label>
        <input type="password" name="passw" placeholder="Password"> <br><br>

        <label>Civil Status: </label> 
        <select name="cstat">
            <option>Select Status</option>
            <option value="single">Single</option>
            <option value="married">Married</option>
            <option value="divorced">Divorced</option>
        </select>  <br> <br>

        

        <label>Birthdate: </label> 
        <select name="bdate">
            <option>Month</option>
            <option value="January">January</option>
            <option value="February">February</option>
            <option value="March">March</option>
            <option value="April">April</option>
            <option value="May">May</option>
            <option value="June">June</option>
        </select>

        <select name="bday">
            <option>Day</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
        </select>
        <select name="byear">
            <option>Year</option>
            <option value="2003">2003</option>
            <option value="2004">2004</option>
            <option value="2005">2005</option>
        </select> <br><br>

        <!-- CHECKBOX SELECTION demo -->
        <h3>GPU</h3>
        <input type="checkbox" name="1050 Ti"> <label>GTX 1050 Ti</label> 
        <br> <br>

        <input type="checkbox" name="1080 Ti"> <label>GTX 1080 Ti</label> 
        <br><br>

        <input type="checkbox" name="RTX 2070 Super">
        <label>RTX 1080 Ti</label> 
        <br><br>

        <h3>GENDER:</h3>
        <input type="radio" value="male" checked>
        <label>Male</label> &nbsp; &nbsp;

        <input type="radio" value="female">
        <label>Female</label> <br><br>

        
        
            <button type="submit" name="register">Register </button>
            <button type="reset" name="rest"> Reset</button>



        </select>
        
        </form>
</body>
</html>
