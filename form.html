<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <h2>STUDENT REGISTRATION FORM</h2>
        <label>FIRST NAME:</label>
    <input type="text" name="fname" maxlength="32" placeholder=" "autofocus required> <br><br> 

        <label>LAST NAME: </label> 
    <input type="text" name="lname" maxlength="16" placeholder=" "> <br><br>

        <label>DATE OF BIRTH: </label>
    <select name="bmonth">
        <option>Month</option>
        <option value="January">January</option>
        <option value="February">February</option>
        <option value="March">March</option>  
    </select>
        
       <select name="bday">
            <option>Day</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option> 
        </select>
         
    <select name="byear">
        <option>Year</option>
        <option value="2001">2001</option>
        <option value="2002">2002</option>
        <option value="2003">2003</option>
    </select><br><br>

    <label>EMAIL ADDRESS: </label>
    <input type="textbox"> <br><br>

    <label>MOBILE NUMBER: </label>
    <input type="text" name="mobile" maxlength="10" placeholder="Enter 10-digit mobile number"> <br><br>

    <label>GENDER</label>
    <input type="radio" name="gender" value="male"> Male
    <input type="radio" name="gender" value="female"> Female
    <br><br> 

    <label>MUNICIPALITY:</label>
    <select name="municipality">
        <option value=""></option>
        <option value="Bangued">Bangued</option>
        <option value="Boliney">Boliney</option>
        <option value="Bucay">Bucay</option>
        <option value="Bucloc">Bucloc</option>
        <option value="Daguioman">Daguioman</option>
        <option value="Danglas">Danglas</option>
        <option value="Dolores">Dolores</option>
        <option value="La Paz">La Paz</option>
        <option value="Lacub">Lacub</option>
        <option value="Lagang">Lagang</option>
        <option value="Lagangilang">Lagangilang</option>
        <option value="Lagayan">Lagayan</option>
        <option value="Langiden">Langiden</option>
        <option value="Licuan-Baay (Baay-Licuan)">Licuan-Baay (Baay-Licuan)</option>
        <option value="Luba">Luba</option>
        <option value="Malibcong">Malibcong</option>
        <option value="Manabo">Manabo</option>
        <option value="Peñarrubia">Peñarrubia</option>
        <option value="Pidigan">Pidigan</option>
        <option value="Pilar">Pilar</option>
        <option value="Sallapadan">Sallapadan</option>
        <option value="San Isidro">San Isidro</option>
        <option value="San Juan">San Juan</option>  
        <option value="San Quintin">San Quintin</option>
        <option value="Tayum">Tayum</option>
        <option value="Tineg">Tineg</option>
        <option value="Villaviciosa">Villaviciosa</option>
        </select> <br><br>

        <label>PIN CODE: </label>
        <input type="text" name="pincode" maxlength="6" placeholder="Enter 6-digit pin code"> (6-digit pin code) <br><br>

        <label>COUNTRY: </label>
        <input type="text" name="country" maxlength="32" placeholder=""> <br><br>

        <label>HOBBIES:</label>
        <input type="checkbox" name="hobbies" value="Basketball"> Basketball
        <input type="checkbox" name="hobbies" value="Playing Online Games"> Playing Online Games
        <input type="radio" name="hobbies" value="Others"> Others <br><br>

        <label>COURSES APPLIED FOR:</label>
        <input type="radio" name="courses" value="BSCS"> BSCS
        <input type="radio" name="courses" value="BSIT"> BSIT <br><br>
        
        
            <button type="submit" name="register">Register </button>
            <button type="reset" name="rest"> Reset</button>

    
</body>
</html>
